<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <title>인출 관리 - MARIA</title>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/withdrawals.css}">
    </th:block>
</head>
<body>
<a layout:fragment="breadcrumb"
   class="breadcrumb-current withdrawal-breadcrumb-link"
   th:href="@{/admin/withdrawals}">인출 관리</a>

<div layout:fragment="content" class="withdrawals-page">
    <div class="withdrawal-page-header">
        <h1>인출 관리</h1>
    </div>

    <div class="withdrawal-filter">
        <label for="withdrawal-keyword">고객 검색</label>
        <input id="withdrawal-keyword" type="search"
               placeholder="고객명 또는 RIA 계좌번호">
        <button type="button" id="withdrawal-search-button">검색</button>
    </div>

    <div class="withdrawal-type-tabs" role="tablist" aria-label="인출 구분">
        <button type="button" class="withdrawal-type-tab active" data-withdrawal-type="ALL">
            전체 <span id="withdrawal-all-count">0</span>
        </button>
        <button type="button" class="withdrawal-type-tab" data-withdrawal-type="NORMAL">
            정상 인출 <span id="withdrawal-normal-count">0</span>
        </button>
        <button type="button" class="withdrawal-type-tab" data-withdrawal-type="EARLY">
            조기 인출 <span id="withdrawal-early-count">0</span>
        </button>
    </div>

    <div class="withdrawal-workspace">
        <section class="withdrawal-list-card">
            <div class="withdrawal-list-table-header" aria-hidden="true">
                <span>계좌번호 / 고객명</span>
                <span>상태</span>
                <span>인출 요청금액</span>
                <span>처리 시각</span>
            </div>
            <div id="withdrawal-list" class="withdrawal-list">
                <div class="withdrawal-empty">인출 내역을 조회하고 있습니다.</div>
            </div>
            <div id="withdrawal-pagination" class="withdrawal-pagination" hidden></div>
        </section>

        <section id="withdrawal-detail" class="withdrawal-detail-card is-empty">
            <div id="withdrawal-detail-empty" class="withdrawal-detail-empty">
                왼쪽 목록에서 인출 내역을 선택해 주세요.
            </div>

            <div id="withdrawal-detail-content" hidden>
                <div class="withdrawal-card-header">
                    <div>
                        <span class="withdrawal-section-label">인출 상세</span>
                        <h2 id="withdrawal-detail-title">인출 내역</h2>
                    </div>
                    <span id="withdrawal-detail-status" class="withdrawal-status-badge"></span>
                </div>

                <dl class="withdrawal-detail-grid">
                    <div><dt>고객명</dt><dd id="withdrawal-customer-name">-</dd></div>
                    <div><dt>RIA 계좌번호</dt><dd id="withdrawal-account-no">-</dd></div>
                    <div><dt>요청 금액</dt><dd id="withdrawal-requested-amount">-</dd></div>
                    <div><dt>목적지 일반계좌</dt><dd id="withdrawal-destination-account">-</dd></div>
                    <div><dt>처리 시각</dt><dd id="withdrawal-processed-at">-</dd></div>
                    <div><dt>조기인출 발생</dt><dd id="withdrawal-early-result">-</dd></div>
                </dl>

                <div class="withdrawal-allocation-summary">
                    <article class="allocation-summary earnings">
                        <span>수익금</span>
                        <strong id="withdrawal-earnings-amount">0원</strong>
                    </article>
                    <article class="allocation-summary matured">
                        <span>1년 경과 원금</span>
                        <strong id="withdrawal-matured-amount">0원</strong>
                    </article>
                    <article class="allocation-summary immature">
                        <span>1년 미경과 원금</span>
                        <strong id="withdrawal-immature-amount">0원</strong>
                    </article>
                </div>

                <div id="withdrawal-early-warning" class="withdrawal-warning" hidden>
                    1년 미경과 원금이 포함되어 세제혜택 전체 취소 대상인 인출입니다.
                </div>

                <section class="withdrawal-allocation-section">
                    <div class="withdrawal-section-header">
                        <div>
                            <h3>납입건별 인출 배분</h3>
                            <p>원금 배분 건은 확정 시각부터 인출 시각까지의 의무유지기간 진행률을 표시합니다.</p>
                        </div>
                        <div class="allocation-navigation">
                            <button type="button" id="previous-allocation" aria-label="이전 배분">&lt;</button>
                            <span id="withdrawal-allocation-count">0 / 0</span>
                            <button type="button" id="next-allocation" aria-label="다음 배분">&gt;</button>
                        </div>
                    </div>
                    <div id="withdrawal-allocations" class="withdrawal-allocations"></div>
                </section>
            </div>
        </section>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/withdrawals.js}"></script>
</th:block>
</body>
</html>
