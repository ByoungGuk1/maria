<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>매도 · 환전 - MARIA</title>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/sellOrder.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">매도 · 환전</div>

<div layout:fragment="content" class="sellorder">
    <div class="sellorder-header">
        <div>
            <h1 class="sellorder-page-title">매도 · 환전</h1>
        </div>
    </div>

    <section class="card sellorder-search-card">
        <div class="section-header">계좌 검색</div>
        <form id="accountSearchForm" class="sellorder-search-form" novalidate>
            <input id="searchAccountNo" type="text" placeholder="계좌번호" autocomplete="off">
            <input id="searchCustomerName" type="text" placeholder="고객명" autocomplete="off">
            <button class="btn btn-primary" type="submit">검색</button>
        </form>
        <p id="searchError" class="sellorder-form-error" style="display:none"></p>

        <div class="sellorder-table-wrap">
            <table class="sellorder-table">
                <thead>
                <tr>
                    <th>계좌번호 / 고객명</th>
                    <th>상태</th>
                    <th class="sellorder-amount">한도 사용률</th>
                </tr>
                </thead>
                <tbody id="searchResultsBody">
                <tr>
                    <td colspan="3" class="sellorder-empty">계좌번호 또는 고객명으로 검색하세요.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section id="selectedAccountCard" class="card sellorder-detail" style="display:none">
        <div class="sellorder-detail-header">
            <div>
                <strong id="selectedAccountNo">-</strong>
                <p class="sellorder-detail-description">선택된 계좌</p>
            </div>
            <span id="selectedAccountStatus" class="sellorder-status-badge">-</span>
        </div>
        <div class="sellorder-detail-grid">
            <div>
                <div class="sellorder-detail-label">고객명</div>
                <div id="selectedCustomerName" class="sellorder-detail-value">-</div>
            </div>
            <div>
                <div class="sellorder-detail-label">설정 한도</div>
                <div id="selectedLimitAmount" class="sellorder-detail-value">-</div>
            </div>
            <div>
                <div class="sellorder-detail-label">사용 금액</div>
                <div id="selectedUsedAmount" class="sellorder-detail-value">-</div>
            </div>
        </div>
    </section>

    <section id="sellOrderCard" class="card sellorder-form-card" style="display:none">
        <div class="section-header">매도 주문 접수</div>
        <div id="holdingsEmpty" class="sellorder-empty" style="display:none">보유 중인 종목이 없습니다.</div>
        <p id="sellOrderReadonlyNotice" class="sellorder-readonly-notice" style="display:none">
            매도 주문 접수는 정산 권한이 필요합니다.
        </p>
        <form id="sellOrderForm" class="sellorder-order-form" novalidate>
            <label>종목
                <select id="sellForeignProductId" required></select>
            </label>
            <label>매도 수량
                <input id="sellQty" type="number" min="0" step="any" required>
            </label>
            <button class="btn btn-primary" type="submit">매도</button>
        </form>
        <p id="sellOrderError" class="sellorder-form-error" style="display:none"></p>
        <p id="sellOrderResult" class="sellorder-form-result" style="display:none"></p>
    </section>

    <section id="sellHistoryCard" class="card sellorder-history" style="display:none">
        <div class="section-header">매도 이력</div>
        <div class="sellorder-table-wrap">
            <table class="sellorder-table">
                <thead>
                <tr>
                    <th>종목</th>
                    <th class="sellorder-amount">매도수량</th>
                    <th class="sellorder-amount">기준가</th>
                    <th>상태</th>
                    <th>처리일시</th>
                </tr>
                </thead>
                <tbody id="sellHistoryBody">
                <tr>
                    <td colspan="5" class="sellorder-empty">매도 이력이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/sellOrder.js}"></script>
</th:block>
</body>
</html>
