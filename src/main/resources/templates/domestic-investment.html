<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/statistics.css}">
        <link rel="stylesheet" th:href="@{/css/domestic-investment.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">국내투자 현황</div>
<div layout:fragment="content">
    <div id="diLoading" class="dash-loading">불러오는 중...</div>
    <div id="diError" class="dash-error" style="display:none"></div>
    <div id="diBody" style="display:none">
        <div class="kpi-grid">
            <div class="card kpi-card kpi-clickable" data-detail="none">
                <div class="kpi-label">전체 계좌 수</div>
                <div class="kpi-value" id="kpiTotalAccount">-</div>
            </div>
            <div class="card kpi-card kpi-clickable" data-detail="restricted">
                <div class="kpi-label">거래제한·정지 계좌 수</div>
                <div class="kpi-value" id="kpiRestrictedAccount">-</div>
            </div>
            <div class="card kpi-card kpi-clickable" data-detail="unpurchasable">
                <div class="kpi-label">매수불가 종목 보유 건수</div>
                <div class="kpi-value" id="kpiUnpurchasable">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label di-recent-header">
                    <span>최근 매수 활동</span>
                    <select id="diRecentDays" class="di-days-select">
                        <option value="1">1일</option>
                        <option value="7">7일</option>
                        <option value="14">14일</option>
                        <option value="30">30일</option>
                    </select>
                </div>
                <div class="kpi-value di-recent-value">
                    <span class="di-recent-item kpi-clickable" data-detail="recentBuy">
                        <strong id="kpiRecentBuy">-</strong>개 있음
                    </span>
                    <span class="di-recent-item kpi-clickable" data-detail="noRecentBuy">
                        <strong id="kpiNoRecentBuy">-</strong>개 없음
                    </span>
                </div>
            </div>
            <div class="card kpi-card">
            <div class="kpi-label">총 예탁금 합계</div>
                <div class="kpi-value kpi-value-amount" id="kpiTotalCash">-</div>
            </div>
        </div>
        <div class="card" id="diDetailPanel" style="display:none">
            <div class="section-header">
                <span id="diDetailTitle">상세</span>
                <span class="section-sub" id="diDetailCount"></span>
                <button type="button" id="diDetailClose" class="di-detail-close" aria-label="닫기">&times;</button>
            </div>
            <table class="dash-table">
                <thead id="diDetailTableHead"></thead>
                <tbody id="diDetailTableBody"></tbody>
            </table>
            <div id="diDetailPagination" class="pagination"></div>
        </div>
        <div class="di-layout">
            <div class="card di-list-card">
                <div class="section-header">
                    <span id="diListTitle">계좌 목록</span>
                </div>
                <div class="filter-bar di-filter-bar">
                    <input type="text" id="diFilterCustomerName" class="filter-input" placeholder="고객명 또는 계좌번호 검색">
                    <select id="diFilterStatus" class="filter-select">
                        <option value="">전체 상태</option>
                        <option value="HOLDING">보유중</option>
                        <option value="PARTIALLY_SOLD">일부매도</option>
                        <option value="SOLD_OUT">전량매도</option>
                        <option value="TRADE_RESTRICTED">거래제한</option>
                        <option value="TRADE_SUSPENDED">거래정지</option>
                        <option value="TERMINATED">보유종료</option>
                    </select>
                    <button type="button" id="diFilterSubmit" class="btn btn-primary">검색</button>
                    <button type="button" id="diFilterReset" class="btn">초기화</button>
                </div>
                <div id="diListItems" class="di-list-items"></div>
                <div id="diPagination" class="pagination"></div>
            </div>
            <div class="card di-detail-card" id="diDetail">
                <div class="dash-empty">왼쪽에서 계좌를 선택하세요.</div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/domestic-investment.js}"></script>
</th:block>
</body>
</html>
