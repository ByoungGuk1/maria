<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>감사 로그 - MARIA</title>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/audit-log.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">감사 로그</div>

<div layout:fragment="content" class="audit-log">
    <div class="audit-log-header">
        <h1 class="audit-log-title">감사 로그</h1>
        <span class="audit-log-count" id="auditLogCount">-</span>
    </div>

    <div class="card audit-log-toolbar">
        <div class="audit-log-filter-group">
            <input id="auditKeywordFilter" class="audit-log-filter audit-log-search-input" type="text"
                   placeholder="계좌번호, 수행자, 대상, 작업유형, 사유로 검색">
            <input id="auditStartDateFilter" class="audit-log-filter" type="datetime-local">
            <span class="audit-log-filter-separator">~</span>
            <input id="auditEndDateFilter" class="audit-log-filter" type="datetime-local">
            <button id="auditLogSearch" class="btn btn-primary" type="button">조회</button>
            <button id="auditLogReset" class="btn" type="button">초기화</button>
        </div>
    </div>

    <div class="card audit-log-table-wrap">
        <table class="audit-log-table">
            <thead>
            <tr>
                <th>일시</th>
                <th>관리자</th>
                <th>작업유형</th>
                <th>대상</th>
                <th>사유</th>
                <th>변경 전</th>
                <th>변경 후</th>
            </tr>
            </thead>
            <tbody id="auditLogListBody">
            <tr>
                <td colspan="7" class="audit-log-loading">불러오는 중...</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="audit-log-pagination" id="auditLogPagination" style="display:none">
        <button id="previousAuditLogPage" class="btn" type="button">이전</button>
        <span id="auditLogPageInfo"></span>
        <button id="nextAuditLogPage" class="btn" type="button">다음</button>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/audit-log.js}"></script>
</th:block>
</body>
</html>
